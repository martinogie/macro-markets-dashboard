name: Refresh data

on:
  schedule:
    - cron: "15 13 * * 1-5"   # 8:15am Chicago (CDT): picks up yesterday's Treasury and market closes
    - cron: "15 23 * * 1-5"   # 6:15pm Chicago (CDT): picks up anything FRED posted during the day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.3
      - run: python pipeline/fetch.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit if data changed
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')" && git push; fi
