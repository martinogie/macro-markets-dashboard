name: Refresh data

on:
  schedule:
    - cron: "15 13 * * 1-5"   # 8:15am Chicago (CDT): picks up yesterday's Treasury and market closes
    - cron: "15 23 * * 1-5"   # 6:15pm Chicago (CDT): picks up anything released during the day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.3 xlrd==2.0.1
      - run: python pipeline/fetch.py
      - name: Commit if data changed
        run: |
          git config user.name "Martins Ogiekpolor"
          git config user.email "mogiekpo88@gmail.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')" && git push; fi
